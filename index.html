<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Muraja'a — Révision du Coran</title>

<meta property="og:site_name" content="Muraja'a">
<meta property="og:title" content="Muraja'a : révise le Coran en jouant">

<meta property="og:url" content="https://generalmanagerapp.github.io/coran-revision/">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Muraja'a">
<meta name="application-name" content="Muraja'a">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<body>
<div id="app">
  <header class="top">
    <div class="brand"><img class="logo" src="icons/logo-mark.svg" alt="" width="22" height="25"> Muraja'a <span class="brand-ar">مراجعة</span></div>
    <div id="sessionInfo" class="session"></div>
  </header>

  <main>
    <!-- RÉVISER -->
    <section id="view-revise" class="view active">
      <div id="modeBar" class="modebar"></div>
      <div id="weakBar" class="weakbar" hidden></div>
      <div id="goal" class="goal"><span></span><i><b></b></i></div>
      <div id="deck" class="deck"></div>
      <div id="deckHint" class="hint"></div>
    </section>

    <!-- SOURATES -->
    <section id="view-surahs" class="view">
      <div class="seg"><button data-tab="s" class="on">Sourates</button><button data-tab="j">Juz</button><button data-tab="h">Hizb</button></div>
      <div class="toolbar">
        <input id="surahSearch" type="search" placeholder="Rechercher une sourate…">
      </div>
      <div class="quick">
        <button data-quick="amma">Juz ʿAmma</button>
        <button data-quick="tabarak">Juz Tabārak</button>
        <button data-quick="none">Tout décocher</button>
      </div>
      <div id="selCount" class="selcount"></div>
      <div id="surahList"></div>
    </section>

    <!-- LIRE -->
    <section id="view-read" class="view">
      <div class="rbar">
        <button data-rnav="-1" aria-label="Sourate précédente">‹</button>
        <select id="readSel" aria-label="Sourate"></select>
        <button data-rnav="1" aria-label="Sourate suivante">›</button>
      </div>
      <div class="rctl">
        <button id="rPlay" class="btn gold"><svg class="ic " width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16l13 -8l-13 -8" /></svg> Écouter</button>
        <button id="rRep" class="btn light" aria-pressed="false"><svg class="ic " width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v-3a3 3 0 0 1 3 -3h13m-3 -3l3 3l-3 3" /> <path d="M20 12v3a3 3 0 0 1 -3 3h-13m3 3l-3 -3l3 -3" /></svg> Répéter le verset</button>
        <button id="rMask" class="btn light" aria-pressed="false"><svg class="ic " width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.585 10.587a2 2 0 0 0 2.829 2.828" /> <path d="M16.681 16.673a8.717 8.717 0 0 1 -4.681 1.327c-3.6 0 -6.6 -2 -9 -6c1.272 -2.12 2.712 -3.678 4.32 -4.674m2.86 -1.146a9.055 9.055 0 0 1 1.82 -.18c3.6 0 6.6 2 9 6c-.666 1.11 -1.379 2.067 -2.138 2.87" /> <path d="M3 3l18 18" /></svg> Masquer</button>
      </div>
      <div id="rExtra" class="rctl2"></div>
      <div id="readBox"></div>
      <div id="nowPlay" class="nowplay" hidden><button data-np="-1" aria-label="Verset précédent">‹</button><span></span><button data-np="1" aria-label="Verset suivant">›</button></div>
    </section>

    <!-- STATS -->
    <section id="view-stats" class="view"><div id="statsBox"></div><div class="adbox" id="adStats" hidden></div></section>

    <!-- RÉGLAGES -->
    <section id="view-settings" class="view"><div id="settingsBox"></div><div class="adbox" id="adSet" hidden></div></section>
  </main>

  <nav class="tabs">
    <button data-view="revise" class="on"><svg class="ic nav" width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.604 7.197l7.138 -3.109a.96 .96 0 0 1 1.27 .527l4.924 11.902a1 1 0 0 1 -.514 1.304l-7.137 3.109a.96 .96 0 0 1 -1.271 -.527l-4.924 -11.903a1 1 0 0 1 .514 -1.304l0 .001" /> <path d="M15 4h1a1 1 0 0 1 1 1v3.5" /> <path d="M20 6c.264 .112 .52 .217 .768 .315a1 1 0 0 1 .53 1.311l-2.298 5.374" /></svg>Réviser</button>
    <button data-view="read"><svg class="ic nav" width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 4v16h-12a2 2 0 0 1 -2 -2v-12a2 2 0 0 1 2 -2h12" /> <path d="M19 16h-12a2 2 0 0 0 -2 2" /> <path d="M9 8h6" /></svg>Lire</button>
    <button data-view="surahs"><svg class="ic nav" width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 5.5l1.5 1.5l2.5 -2.5" /> <path d="M3.5 11.5l1.5 1.5l2.5 -2.5" /> <path d="M3.5 17.5l1.5 1.5l2.5 -2.5" /> <path d="M11 6l9 0" /> <path d="M11 12l9 0" /> <path d="M11 18l9 0" /></svg>Sourates</button>
    <button data-view="stats"><svg class="ic nav" width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v6a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -6" /> <path d="M15 9a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v10a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -10" /> <path d="M9 5a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v14a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -14" /> <path d="M4 20h14" /></svg>Suivi</button>
    <button data-view="settings"><svg class="ic nav" width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065" /> <path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" /></svg>Réglages</button>
  </nav>
</div>
